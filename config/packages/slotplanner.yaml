# Slotplanner for Home Assistant
# Plans devices in the cheapest blocks of the day, using dynamic prices and the solar forecast.
# Do not edit this file: every setting lives in custom_templates/slotplanner_config.jinja.
# https://github.com/emeryf81/HA-EMS-scheduler

template:
  # ------------------------------------------------------------ configuration and setup check
  - trigger:
      - trigger: homeassistant
        event: start
      - trigger: event
        event_type: slotplanner_reload
      - trigger: time_pattern
        minutes: "/10"
    sensor:
      - name: "Slotplanner config"
        unique_id: slotplanner_config
        icon: mdi:cog
        state: "{% from 'slotplanner.jinja' import sp_check_config_j %}{{ 'ok' if (sp_check_config_j() | from_json) | count == 0 else 'check' }}"
        attributes:
          config: "{% from 'slotplanner.jinja' import sp_cfg_j %}{{ sp_cfg_j() | from_json }}"
          errors: "{% from 'slotplanner.jinja' import sp_check_config_j %}{{ sp_check_config_j() | from_json }}"
          version: "1.0.0"

  # ------------------------------------------------- planner state (written by script.slotplanner_write)
  - trigger:
      - trigger: event
        event_type: slotplanner_state
    sensor:
      - name: "Slotplanner state"
        unique_id: slotplanner_state
        icon: mdi:calendar-clock
        state: "{{ trigger.event.data.plans | selectattr('st', 'in', ['planned', 'active']) | list | count }}"
        attributes:
          plans: "{{ trigger.event.data.plans }}"
          settings: "{{ trigger.event.data.settings }}"
          touched: "{{ trigger.event.data.touched }}"
          rev: "{{ trigger.event.data.rev }}"

  # ------------------------------------------------------ prices (script.slotplanner_fetch_prices)
  - trigger:
      - trigger: event
        event_type: slotplanner_prices
    sensor:
      - name: "Slotplanner prices"
        unique_id: slotplanner_prices
        icon: mdi:cash-clock
        state: "{{ trigger.event.data.prices | count }}"
        attributes:
          prices: "{{ trigger.event.data.prices }}"
          request: "{{ trigger.event.data.request }}"
          fetched: "{{ now().isoformat() }}"

  # ------------------------------------------------------- cheap blocks (script.slotplanner_find_slots)
  - trigger:
      - trigger: event
        event_type: slotplanner_slots
    sensor:
      - name: "Slotplanner slots"
        unique_id: slotplanner_slots
        icon: mdi:calendar-search
        state: "{{ trigger.event.data.slots | count }}"
        attributes:
          slots: "{{ trigger.event.data.slots }}"
          solar: "{{ trigger.event.data.solar | default([]) }}"
          found: "{{ now().isoformat() }}"

  # ------------------------------------------------------------- history of finished runs
  - trigger:
      - trigger: event
        event_type: slotplanner_history
    sensor:
      - name: "Slotplanner history"
        unique_id: slotplanner_history
        icon: mdi:history
        state: "{{ trigger.event.data.runs | count }}"
        attributes:
          runs: "{{ trigger.event.data.runs }}"

  # ---------------------------------------------------------------- statistics and learning
  - trigger:
      - trigger: event
        event_type: slotplanner_stats
    sensor:
      - name: "Slotplanner stats"
        unique_id: slotplanner_stats
        icon: mdi:piggy-bank
        state: "{{ (trigger.event.data.year.values() | map(attribute='bes') | sum) | round(2) }}"
        attributes:
          week: "{{ trigger.event.data.week }}"
          month: "{{ trigger.event.data.month }}"
          year: "{{ trigger.event.data.year }}"
          learn: "{{ trigger.event.data.learn }}"
          since: "{{ trigger.event.data.since }}"

script:
  # ===================================================================== storage
  slotplanner_write:
    alias: "Slotplanner: write state"
    description: "The only script that changes the planner state. Takes a list of operations (see slotplanner_store.jinja)."
    icon: mdi:database-edit
    mode: queued
    max: 50
    fields:
      ops:
        description: "List of operations"
        required: true
        selector:
          object:
    sequence:
      - variables:
          cur: "{% from 'slotplanner.jinja' import sp_state_j %}{{ sp_state_j() | from_json }}"
          res: "{% from 'slotplanner_store.jinja' import sp_apply_j %}{{ sp_apply_j(cur, ops if ops is list else [ops], as_timestamp(now())) | from_json }}"
      - event: slotplanner_state
        event_data:
          plans: "{{ res.state.plans }}"
          settings: "{{ res.state.settings }}"
          touched: "{{ res.state.touched }}"
          rev: "{{ res.state.rev }}"
      - if:
          - condition: template
            value_template: "{{ res.archive | count > 0 }}"
        then:
          - variables:
              arc: "{% from 'slotplanner_store.jinja' import sp_archive_j %}{{ sp_archive_j(res.archive, 80) | from_json }}"
          - event: slotplanner_history
            event_data:
              runs: "{{ arc.runs }}"
          - event: slotplanner_stats
            event_data:
              week: "{{ arc.stats.week }}"
              month: "{{ arc.stats.month }}"
              year: "{{ arc.stats.year }}"
              learn: "{{ arc.stats.learn }}"
              since: "{{ arc.stats.since }}"
      - wait_template: "{{ state_attr('sensor.slotplanner_state', 'rev') | int(0) >= res.state.rev | int }}"
        timeout: "00:00:10"
        continue_on_timeout: true

  slotplanner_transition:
    alias: "Slotplanner: serialize device transitions"
    mode: queued
    max: 20
    sequence:
      - if: "{{ plan_id | default('') != '' }}"
        then:
          - action: script.slotplanner_remove
            data:
              plan_id: "{{ plan_id }}"
        else:
          - variables:
              tick: "{% from 'slotplanner_tick.jinja' import sp_tick_j %}{{ sp_tick_j() | from_json }}"
          - repeat:
              for_each: "{{ tick.calls | selectattr('script', 'eq', 'slotplanner_stop') | list }}"
              sequence:
                - action: "script.{{ repeat.item.script }}"
                  data: "{{ repeat.item.v }}"
          - if:
              - condition: template
                value_template: "{{ tick.ops | count > 0 }}"
            then:
              - action: script.slotplanner_write
                data:
                  ops: "{{ tick.ops }}"
          - repeat:
              for_each: "{{ tick.calls | rejectattr('script', 'eq', 'slotplanner_stop') | list }}"
              sequence:
                - action: "script.{{ repeat.item.script }}"
                  data: "{{ repeat.item.v }}"
                  continue_on_error: true

  # ===================================================================== planning
  slotplanner_plan:
    alias: "Slotplanner: plan a device"
    description: "Plans a device in the block that starts at start (epoch). move_from = id of a plan of the same device that moves."
    icon: mdi:calendar-edit
    mode: queued
    max: 20
    fields:
      device:
        required: true
        selector:
          text:
      start:
        required: true
        selector:
          number:
            min: 0
            max: 9999999999
            mode: box
      move_from:
        required: false
        selector:
          text:
      req:
        description: "Optional request id. The result is stored in the settings as last, for the card."
        required: false
        selector:
          text:
    sequence:
      - variables:
          rq: "{{ req if req is defined and req else '' }}"
          mv: "{{ move_from if move_from is defined and move_from else '' }}"
          s: "{{ start | int(0) }}"
          plans: "{% from 'slotplanner.jinja' import sp_state_j %}{{ (sp_state_j() | from_json).plans }}"
          why: "{% from 'slotplanner.jinja' import sp_conflict %}{{ sp_conflict(device, start | int(0), mv) | trim }}"
          moving_active: "{{ mv != '' and plans | selectattr('id', 'eq', mv) | selectattr('st', 'eq', 'active') | list | count > 0 }}"
      - if:
          - condition: template
            value_template: "{{ why != '' or s | int == 0 or moving_active }}"
        then:
          - variables:
              err: "{% from 'slotplanner_i18n.jinja' import t %}{{ t('err_active') if moving_active else t('err_' ~ (why or 'past')) }}"
          - action: script.slotplanner_write
            data:
              ops: "{{ [{'op': 'settings', 'f': {'last': {'req': rq, 'ok': false, 'msg': err}}}] }}"
          - stop: "{{ err }}"
            error: true
      - action: script.slotplanner_write
        data:
          ops: >-
            {% from 'slotplanner_i18n.jinja' import t %}
            {{ ([{'op': 'del', 'id': mv, 'archive': false}] if mv else []) +
               [{'op': 'add', 'd': device, 's': s | int},
                {'op': 'step', 'id': device ~ ':' ~ (s | int), 'w': t('step_planned', (s | int) | timestamp_custom('%d/%m %H:%M')), 'r': 'info'},
                {'op': 'settings', 'f': {'last': {'req': rq, 'ok': true, 'msg': ''}}}] }}
      - action: logbook.log
        data:
          name: Slotplanner
          message: "{% from 'slotplanner.jinja' import sp_name %}{% from 'slotplanner_i18n.jinja' import t %}{{ sp_name(device) }}: {{ t('step_planned', (s | int) | timestamp_custom('%d/%m %H:%M')) }}"

  slotplanner_unplan:
    sequence:
      - action: script.slotplanner_transition
        data:
          plan_id: "{{ plan_id }}"

  slotplanner_remove:
    alias: "Slotplanner: remove a plan"
    description: "Removes a plan. A running device is stopped first."
    icon: mdi:calendar-remove
    mode: queued
    max: 20
    fields:
      plan_id:
        required: true
        selector:
          text:
    sequence:
      - variables:
          p: "{% from 'slotplanner.jinja' import sp_state_j %}{{ ((sp_state_j() | from_json).plans | selectattr('id', 'eq', plan_id) | list | first) | default({}) }}"
      - condition: template
        value_template: "{{ p.id is defined }}"
      - if:
          - condition: template
            value_template: "{{ p.st == 'active' }}"
        then:
          - action: script.slotplanner_stop
            data:
              device: "{{ p.d }}"
              plan_id: "{{ p.id }}"
      - action: script.slotplanner_write
        data:
          ops: >-
            {% from 'slotplanner_i18n.jinja' import t %}
            {{ ([{'op': 'set', 'id': p.id, 'f': {'st': 'stopped', 'e': as_timestamp(now()) | int}}] if p.st == 'active' else []) +
               [{'op': 'step', 'id': p.id, 'w': t('step_unplanned'), 'r': 'info'},
                {'op': 'del', 'id': p.id, 'archive': p.st == 'active' or (p.m.kwh | default(0)) > 0}] }}

  slotplanner_clear:
    alias: "Slotplanner: remove every planned block"
    description: "Removes all plans that did not start yet."
    icon: mdi:calendar-remove-outline
    mode: single
    sequence:
      - action: script.slotplanner_write
        data:
          ops: >-
            {% from 'slotplanner.jinja' import sp_state_j %}
            {% set ns = namespace(v=[]) %}{% for p in (sp_state_j() | from_json).plans if p.st == 'planned' %}{% set ns.v = ns.v + [{'op': 'del', 'id': p.id, 'archive': false}] %}{% endfor %}{{ ns.v }}

  slotplanner_settings:
    alias: "Slotplanner: change settings"
    description: "Merges settings: enabled, autoplan {device: bool}, subs, nightly, overview, early, remind."
    icon: mdi:cog-outline
    mode: queued
    fields:
      settings:
        required: true
        selector:
          object:
    sequence:
      - action: script.slotplanner_write
        data:
          ops: "{{ [{'op': 'settings', 'f': settings}] }}"

  slotplanner_reload:
    alias: "Slotplanner: reload configuration"
    description: "Run this after you changed slotplanner_config.jinja."
    icon: mdi:reload
    mode: single
    sequence:
      - action: homeassistant.reload_custom_templates
      - delay:
          seconds: 1
      - event: slotplanner_reload
      - action: script.slotplanner_refresh

  # ===================================================================== prices and blocks
  slotplanner_fetch_prices:
    alias: "Slotplanner: fetch prices"
    description: "Reads today's and tomorrow's prices from the configured source and stores them per quarter hour."
    icon: mdi:cash-sync
    mode: single
    max_exceeded: silent
    sequence:
      - variables:
          pc: "{% from 'slotplanner.jinja' import sp_cfg_j %}{{ (sp_cfg_j() | from_json).prices }}"
          d0: "{{ now().strftime('%Y-%m-%d') }}"
          d1: "{{ (now() + timedelta(days=1)).strftime('%Y-%m-%d') }}"
      - choose:
          - conditions: "{{ pc.source == 'nordpool' }}"
            sequence:
              - action: nordpool.get_prices_for_date
                data:
                  config_entry: "{{ pc.config_entry }}"
                  date: "{{ d0 }}"
                response_variable: r0
                continue_on_error: true
              - action: nordpool.get_prices_for_date
                data:
                  config_entry: "{{ pc.config_entry }}"
                  date: "{{ d1 }}"
                response_variable: r1
                continue_on_error: true
              - variables:
                  raw: >-
                    {% set ns = namespace(v=[]) %}
                    {% for r in [r0 if r0 is defined else {}, r1 if r1 is defined else {}] if r is mapping %}
                    {% set key = pc.area if pc.area and pc.area in r else (r.keys() | list | first | default('')) %}
                    {% if key %}{% set ns.v = ns.v + (r[key] | list) %}{% endif %}
                    {% endfor %}{{ ns.v }}
          - conditions: "{{ pc.source == 'tibber' }}"
            sequence:
              - action: tibber.get_prices
                data:
                  start: "{{ d0 }} 00:00:00"
                  end: "{{ d1 }} 23:59:59"
                response_variable: r0
                continue_on_error: true
              - variables:
                  raw: >-
                    {% set pr = (r0.prices if r0 is defined and r0 is mapping and r0.prices is defined else {}) %}
                    {{ (pr.values() | list | first | default([])) | list }}
        default:
          - variables:
              raw: "{% from 'slotplanner.jinja' import sp_price_raw_attr_j %}{{ sp_price_raw_attr_j() | from_json }}"
      - variables:
          prices: "{% from 'slotplanner.jinja' import sp_norm_prices_j %}{{ sp_norm_prices_j(raw, pc.time_key, pc.price_key, pc.unit, pc.multiply, pc.add) | from_json }}"
      - if:
          - condition: template
            value_template: "{{ prices | count > 0 }}"
        then:
          - variables:
              price_request: "{{ now().isoformat() }}"
          - event: slotplanner_prices
            event_data:
              prices: "{{ prices }}"
              request: "{{ price_request }}"
          - wait_template: "{{ state_attr('sensor.slotplanner_prices', 'request') == price_request }}"
            timeout: "00:00:05"
            continue_on_timeout: false
        else:
          - action: logbook.log
            data:
              name: Slotplanner
              message: "{% from 'slotplanner_i18n.jinja' import t %}{{ t('log_noprices') }}"

  slotplanner_find_slots:
    alias: "Slotplanner: find cheap blocks"
    description: "Finds the cheapest blocks that do not overlap, with the expected sun counted at the feed-in price. Blocks that hold a plan stay."
    icon: mdi:calendar-search
    mode: single
    max_exceeded: silent
    sequence:
      - variables:
          slots: "{% from 'slotplanner.jinja' import sp_find_slots_j %}{{ sp_find_slots_j() | from_json }}"
          solar: >-
            {% from 'slotplanner.jinja' import sp_solar_j, sp_prices_j %}
            {% set ts = (sp_prices_j() | from_json) | map(attribute=0) | list %}{% set z = sp_solar_j(ts) | from_json %}
            {% set ns = namespace(v=[]) %}{% for t in ts if z.get(t | string, 0) | float(0) > 0 %}{% set ns.v = ns.v + [[t, z[t | string]]] %}{% endfor %}{{ ns.v }}
          bh: "{% from 'slotplanner.jinja' import sp_cfg_j %}{{ (sp_cfg_j() | from_json).general.block_hours }}"
      - event: slotplanner_slots
        event_data:
          slots: "{{ slots }}"
          solar: "{{ solar }}"
      - action: logbook.log
        data:
          name: Slotplanner
          message: "{% from 'slotplanner_i18n.jinja' import t %}{{ t('log_slots', slots | count, bh, states('sensor.slotplanner_prices')) }}"

  slotplanner_refresh:
    alias: "Slotplanner: fetch prices and find blocks"
    icon: mdi:refresh
    mode: single
    max_exceeded: silent
    sequence:
      - action: script.slotplanner_fetch_prices
      - action: script.slotplanner_find_slots

  slotplanner_autoplan:
    alias: "Slotplanner: plan automatically"
    description: "Gives every device with autoplan the cheapest free block. Appliances only when they are ready, cars as many blocks as they need."
    icon: mdi:calendar-star
    mode: single
    max_exceeded: silent
    sequence:
      - if:
          - condition: template
            value_template: "{{ (state_attr('sensor.slotplanner_slots', 'slots') or []) | selectattr('e', 'gt', as_timestamp(now()) | int + 7200) | list | count == 0 }}"
        then:
          - action: script.slotplanner_refresh
      - variables:
          order: >-
            {% from 'slotplanner.jinja' import sp_cfg_j, sp_settings_j, sp_state_j, sp_check_j, sp_ev_blocks %}
            {% set c = sp_cfg_j() | from_json %}{% set st = sp_settings_j() | from_json %}{% set plans = (sp_state_j() | from_json).plans %}
            {% set ns = namespace(first=[], later=[]) %}
            {% for x in c.devices if st.autoplan[x.id] and x.autoplan != 'off' and (not x.autoplan_if or is_state(x.autoplan_if, 'on')) %}
            {% set have = plans | selectattr('d', 'eq', x.id) | selectattr('st', 'in', ['planned', 'active']) | list | count %}
            {% if x.autoplan == 'when_ready' %}
              {% if have == 0 and (sp_check_j(x.id) | from_json).ready %}{% set ns.first = ns.first + [x.id] %}{% endif %}
            {% elif x.autoplan == 'daily' %}
              {% if have == 0 and (sp_check_j(x.id) | from_json).ready %}{% set ns.first = ns.first + [x.id] %}{% endif %}
            {% elif x.autoplan == 'ev' %}
              {% set need = [sp_ev_blocks(x.id) | int - have, 0] | max %}
              {% if need > 0 %}{% set ns.first = ns.first + [x.id] %}{% set ns.later = ns.later + [x.id] * (need - 1) %}{% endif %}
            {% endif %}
            {% endfor %}{{ ns.first + ns.later }}
      - repeat:
          for_each: "{{ order }}"
          sequence:
            - variables:
                slot: "{% from 'slotplanner.jinja' import sp_free_slot %}{{ sp_free_slot(repeat.item, 7200) | int(0) }}"
            - if:
                - condition: template
                  value_template: "{{ slot | int > 0 }}"
              then:
                - action: script.slotplanner_plan
                  data:
                    device: "{{ repeat.item }}"
                    start: "{{ slot | int }}"
                  continue_on_error: true
      - action: logbook.log
        data:
          name: Slotplanner
          message: "{% from 'slotplanner.jinja' import sp_name %}{% from 'slotplanner_i18n.jinja' import t %}{% set ns = namespace(v=[]) %}{% for d in order %}{% set ns.v = ns.v + [sp_name(d) | trim] %}{% endfor %}{{ t('log_autoplan', ns.v | join(', ') if ns.v else '-') }}"

  slotplanner_replan:
    alias: "Slotplanner: plan again after a failure"
    description: "Once per device per day: the next cheapest free block, with a message."
    icon: mdi:calendar-refresh
    mode: queued
    fields:
      device:
        required: true
        selector:
          text:
      why:
        required: false
        selector:
          text:
    sequence:
      - variables:
          st: "{% from 'slotplanner.jinja' import sp_settings_j %}{{ sp_settings_j() | from_json }}"
          today: "{{ now().strftime('%Y-%m-%d') }}"
          nm: "{% from 'slotplanner.jinja' import sp_name %}{{ sp_name(device) }}"
      - condition: template
        value_template: "{{ st.autoplan[device] | default(false) and st.replanned.get(device) != today }}"
      - action: script.slotplanner_write
        data:
          ops: "{{ [{'op': 'settings', 'f': {'replanned': dict(st.replanned, **{device: today})}}] }}"
      - variables:
          slot: "{% from 'slotplanner.jinja' import sp_free_slot %}{{ sp_free_slot(device, 3600) | int(0) }}"
      - if:
          - condition: template
            value_template: "{{ slot | int > 0 }}"
        then:
          - action: script.slotplanner_plan
            data:
              device: "{{ device }}"
              start: "{{ slot | int }}"
            continue_on_error: true
          - action: script.slotplanner_write
            data:
              ops: "{% from 'slotplanner_i18n.jinja' import t %}{{ [{'op': 'step', 'id': device ~ ':' ~ (slot | int), 'w': t('step_replanned', (slot | int) | timestamp_custom('%d/%m %H:%M')), 'r': 'info'}] }}"
      - action: script.slotplanner_notify
        data:
          kind: replan
          device: "{{ device }}"
          r: fail
          title: "{% from 'slotplanner_i18n.jinja' import t %}{{ t('n_replan_title', nm) }}"
          message: "{% from 'slotplanner_i18n.jinja' import t %}{{ t('n_replan', nm, why | default(''), (slot | int) | timestamp_custom('%d/%m %H:%M')) if slot | int > 0 else t('n_replan_none', nm, why | default('')) }}"

  # ===================================================================== running devices
  slotplanner_start:
    alias: "Slotplanner: start a device"
    description: "Runs the start for the device type, then the extra start_actions. The executor checks that an appliance really runs."
    icon: mdi:play
    mode: parallel
    max: 20
    fields:
      device:
        required: true
        selector:
          text:
      plan_id:
        required: true
        selector:
          text:
      resume:
        required: false
        selector:
          boolean:
    sequence:
      - variables:
          x: "{% from 'slotplanner.jinja' import sp_dev_j %}{{ sp_dev_j(device) | from_json }}"
          on_list: >-
            {% if x.type in ['switch', 'ev'] and x.switch %}{{ [x.switch] if is_state(x.switch, 'off') else [] }}
            {% elif x.type == 'climate' %}{{ x.climates | select('is_state', 'off') | list }}
            {% else %}{{ [] }}{% endif %}
      - choose:
          - conditions: "{{ x.type == 'appliance' }}"
            sequence:
              - action: button.press
                target:
                  entity_id: "{{ x.start_button }}"
                continue_on_error: true
          - conditions: "{{ x.type in ['switch', 'ev'] and x.switch != '' }}"
            sequence:
              - action: switch.turn_on
                target:
                  entity_id: "{{ x.switch }}"
                continue_on_error: true
          - conditions: "{{ x.type == 'climate' }}"
            sequence:
              - repeat:
                  for_each: "{{ x.climates }}"
                  sequence:
                    - action: climate.set_hvac_mode
                      target:
                        entity_id: "{{ repeat.item }}"
                      data:
                        hvac_mode: "{{ x.hvac_mode }}"
                      continue_on_error: true
                    - if:
                        - condition: template
                          value_template: "{{ x.temperature | float(0) > 0 }}"
                      then:
                        - action: climate.set_temperature
                          target:
                            entity_id: "{{ repeat.item }}"
                          data:
                            temperature: "{{ x.temperature | float }}"
                          continue_on_error: true
      - repeat:
          for_each: "{{ x.start_actions }}"
          sequence:
            - action: "{{ repeat.item.action }}"
              target: "{{ repeat.item.target | default({}) }}"
              data: "{{ repeat.item.data | default({}) }}"
              continue_on_error: true
      - action: script.slotplanner_write
        data:
          ops: >-
            {% from 'slotplanner_i18n.jinja' import t %}
            {% set p = (state_attr('sensor.slotplanner_state', 'plans') or []) | selectattr('id', 'eq', plan_id) | list | first | default({}) %}
            {% set f = p.f | default({}) %}
            {{ [{'op': 'touch', 'add': on_list}, {'op': 'set', 'id': plan_id, 'f': {'owned': ((p.owned | default([])) + on_list) | unique | list, 'f': dict(f, on=1 if (on_list or f.on | default(0)) else 0)}}] +
               ([{'op': 'step', 'id': plan_id, 'w': t('step_active', on_list | join(', ')), 'r': 'ok'}] if (on_list and not resume | default(false)) else []) }}

  slotplanner_stop:
    alias: "Slotplanner: stop a device"
    description: "Switches off what the planner switched on for this device, then runs the extra stop_actions."
    icon: mdi:stop
    mode: parallel
    max: 20
    fields:
      device:
        required: true
        selector:
          text:
      plan_id:
        required: false
        selector:
          text:
      pause:
        required: false
        selector:
          boolean:
      quiet:
        required: false
        selector:
          boolean:
    sequence:
      - variables:
          x: "{% from 'slotplanner.jinja' import sp_dev_j %}{{ sp_dev_j(device) | from_json }}"
          p: "{{ ((state_attr('sensor.slotplanner_state', 'plans') or []) | selectattr('id', 'eq', plan_id | default('')) | list | first) | default({}) }}"
          mine: >-
            {% set ents = ([x.switch] if x.switch is defined and x.switch else []) + (x.climates if x.climates is defined else []) %}
            {{ ((entities | default([])) + ents + (p.owned | default([]))) | unique | select('in', state_attr('sensor.slotplanner_state', 'touched') or []) | list }}
      - action: script.slotplanner_write
        data:
          ops: "{{ [{'op': 'set', 'id': plan_id, 'f': {'shutdown_pending': true}}] if plan_id | default('') else [] }}"
      - if:
          - condition: template
            value_template: "{{ not quiet | default(false) or p.shutdown_pending | default(false) }}"
        then:
          - repeat:
              for_each: "{{ mine }}"
              sequence:
                - action: "{{ 'climate.turn_off' if repeat.item.startswith('climate.') else 'homeassistant.turn_off' }}"
                  target:
                    entity_id: "{{ repeat.item }}"
          - repeat:
              for_each: "{{ x.stop_actions | default([]) }}"
              sequence:
                - action: "{{ repeat.item.action }}"
                  target: "{{ repeat.item.target | default({}) }}"
                  data: "{{ repeat.item.data | default({}) }}"
      - action: script.slotplanner_write
        data:
          ops: "{{ [{'op': 'touch', 'remove': [] if pause | default(false) else mine}] + ([{'op': 'set', 'id': plan_id, 'f': {'shutdown_pending': false}}] if plan_id | default('') else []) }}"

  # ===================================================================== messages and e-mail
  slotplanner_notify:
    alias: "Slotplanner: send a message"
    description: "Sends a phone message to everyone who asked for this kind of message (card, tab Reports)."
    icon: mdi:bell-ring
    mode: parallel
    max: 30
    fields:
      kind:
        description: "step, early, remind, stopped or replan"
        required: true
        selector:
          text:
      device:
        required: true
        selector:
          text:
      r:
        required: false
        selector:
          text:
      title:
        required: false
        selector:
          text:
      message:
        required: true
        selector:
          text:
    sequence:
      - variables:
          c: "{% from 'slotplanner.jinja' import sp_cfg_j %}{{ sp_cfg_j() | from_json }}"
          st: "{% from 'slotplanner.jinja' import sp_settings_j %}{{ sp_settings_j() | from_json }}"
          nm: "{% from 'slotplanner.jinja' import sp_name %}{{ sp_name(device) }}"
          rr: "{{ r | default('info') }}"
          today: "{{ now().strftime('%Y-%m-%d') }}"
          who: >-
            {% set ns = namespace(v=[]) %}
            {% if kind == 'early' %}{% set ns.v = st.early %}
            {% elif kind == 'remind' %}{% set ns.v = st.remind %}
            {% endif %}
            {% for a in st.subs if (not a.until or a.until >= today) and (not a.devices or device in a.devices) %}
            {% if a.level == 'all' or (a.level == 'important' and (rr in ['ok', 'fail'] or kind in ['stopped', 'replan'])) or (a.level == 'fail' and (rr == 'fail' or kind in ['stopped', 'replan'])) %}{% set ns.v = ns.v + [a.person] %}{% endif %}
            {% endfor %}
            {{ c.people | selectattr('id', 'in', ns.v | unique | list) | selectattr('notify', 'defined') | rejectattr('notify', 'eq', '') | list }}
      - repeat:
          for_each: "{{ who }}"
          sequence:
            - action: "{{ repeat.item.notify }}"
              data:
                title: "{{ title if title is defined and title else nm }}"
                message: "{{ message if title is defined and title else message }}"
              continue_on_error: true

  slotplanner_mail:
    alias: "Slotplanner: e-mail a report"
    description: "Renders a report and mails it to the chosen people (email_service in the configuration)."
    icon: mdi:email-fast
    mode: queued
    fields:
      report:
        description: "today, day, night, week, month, year, diagnostics, plan, all"
        required: true
        selector:
          text:
      day:
        required: false
        selector:
          text:
      days:
        required: false
        selector:
          number:
            min: 1
            max: 60
      key:
        required: false
        selector:
          text:
      devices:
        required: false
        selector:
          object:
      people:
        required: true
        selector:
          object:
    sequence:
      - variables:
          c: "{% from 'slotplanner.jinja' import sp_cfg_j %}{{ sp_cfg_j() | from_json }}"
          to: "{{ c.people | selectattr('id', 'in', people) | map(attribute='email') | select | list }}"
          dg: "{{ day | default('') }}"
          dd: "{{ days | default(7) | int }}"
          kk: "{{ key | default('') }}"
          dv: "{{ devices | default([]) }}"
      - condition: template
        value_template: "{{ c.notifications.email_service != '' and to | count > 0 }}"
      - action: "{{ c.notifications.email_service }}"
        data:
          title: "{% from 'slotplanner_report.jinja' import sp_report_subject %}{{ sp_report_subject(report, dg, dd, kk) }}"
          message: "Slotplanner"
          target: "{{ to }}"
          data:
            html: "{% from 'slotplanner_report.jinja' import sp_report %}{{ sp_report(report, dg, dd, dv, kk) }}"

automation:
  - id: slotplanner_executor
    alias: "Slotplanner: executor (every minute)"
    description: "Starts, follows, measures and ends every planned block. Logic: custom_templates/slotplanner_tick.jinja."
    mode: single
    max_exceeded: silent
    trace:
      stored_traces: 20
    triggers:
      - trigger: time_pattern
        minutes: "/1"
    actions:
      - action: script.slotplanner_transition

  - id: slotplanner_schedule
    alias: "Slotplanner: daily schedule"
    description: "Fetches prices every hour, finds the blocks at fetch_time, plans automatically at autoplan_time and mails the nightly report at report_time."
    mode: queued
    triggers:
      - trigger: homeassistant
        event: start
        id: start
      - trigger: time_pattern
        minutes: "/1"
        id: minute
    actions:
      - variables:
          g: "{% from 'slotplanner.jinja' import sp_cfg_j %}{{ (sp_cfg_j() | from_json).general }}"
          hm: "{{ now().strftime('%H:%M') }}"
      - if: "{{ trigger.id == 'start' }}"
        continue_on_error: true
        then:
          - delay:
              seconds: 30
          - event: slotplanner_reload
          - action: script.slotplanner_fetch_prices
          - if:
              - condition: template
                value_template: "{{ states('sensor.slotplanner_slots') in ['unknown', 'unavailable', '0'] }}"
            then:
              - action: script.slotplanner_find_slots
      - if: "{{ hm == g.fetch_time }}"
        continue_on_error: true
        then:
          - action: script.slotplanner_refresh
      - if: "{{ hm == g.autoplan_time }}"
        continue_on_error: true
        then:
          - action: script.slotplanner_autoplan
      - if: "{{ hm == g.report_time }}"
        continue_on_error: true
        then:
          - variables:
              st: "{% from 'slotplanner.jinja' import sp_settings_j %}{{ sp_settings_j() | from_json }}"
              y: "{{ (now() - timedelta(days=1)).strftime('%Y-%m-%d') }}"
          - if:
              - condition: template
                value_template: "{{ st.nightly | count > 0 }}"
            then:
              - action: script.slotplanner_mail
                data:
                  report: night
                  day: "{{ y }}"
                  people: "{{ st.nightly }}"
          - if:
              - condition: template
                value_template: "{{ st.overview | count > 0 and (now().weekday() == 0 or now().day == 1) }}"
            then:
              - action: script.slotplanner_mail
                data:
                  report: "{{ 'year' if (now().month == 1 and now().day == 1) else ('month' if now().day == 1 else 'week') }}"
                  people: "{{ st.overview }}"
          - action: script.slotplanner_write
            data:
              ops: >-
                {% from 'slotplanner.jinja' import sp_settings_j %}
                {% set st = sp_settings_j() | from_json %}{% set today = now().strftime('%Y-%m-%d') %}
                {% set ns = namespace(v=[]) %}{% for a in st.subs if not a.until or a.until >= today %}{% set ns.v = ns.v + [a] %}{% endfor %}
                {{ [{'op': 'settings', 'f': {'subs': ns.v}}] }}
      - if: "{{ now().minute == 5 }}"
        continue_on_error: true
        then:
          - action: script.slotplanner_fetch_prices
